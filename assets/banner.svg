nite}.dash-flow-rev{stroke-dasharray:6 10;animation:flowRev 16s linear infinite}.node-pulse{animation:nodeGlow 3s ease-in-out infinite alternate}.card-float1{animation:floatA 6s ease-in-out infinite alternate}.card-float2{animation:floatB 7s ease-in-out infinite alternate}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><circle cx="200" cy="100" r="220" fill="url(#orbGrad1)" class="pulse-orb1" filter="url(#glow)"/><circle cx="1020" cy="300" r="260" fill="url(#orbGrad2)" class="pulse-orb2" filter="url(#glow)"/><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 60 70 Q 300 20 600 70 T 1140 70" class="dash-flow"/><path fill="none" stroke="#a855f7" stroke-width="2" d="M 60 360 Q 350 400 600 355 T 1140 360" class="dash-flow-rev"/><path fill="none" stroke="#64748b" stroke-dasharray="4 6" stroke-width="1.2" d="M 120 70 L 180 340 M 1080 70 L 1020 340 M 350 360 L 400 390 M 850 360 L 800 390"/></g><g class="card-float1" opacity=".85"><rect width="170" height="40" x="70" y="295" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" rx="20"/><circle cx="95" cy="315" r="6" fill="#38bdf8" class="node-pulse"/><text x="115" y="321" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Unified Endpoint</text></g><g class="card-float2" opacity=".85"><rect width="170" height="40" x="960" y="295" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" rx="20"/><circle cx="985" cy="315" r="6" fill="#a855f7" class="node-pulse"/><text x="1005" y="321" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Self-Hosted RMM</text></g><g class="card-float2" opacity=".75"><rect width="150" height="34" x="70" y="115" fill="#1e293b" stroke="#10b981" stroke-width="1.2" rx="17"/><circle cx="90" cy="132" r="5" fill="#10b981"/><text x="106" y="137" fill="#